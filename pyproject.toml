[project]
name = "forensicaudio"
version = "0.0.1"
description = "Audio enhancement and target-speaker extraction for forensic / investigative use"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.5",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "librosa>=0.10",
    "noisereduce>=3.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "speechbrain>=1.0",
    "deepfilternet>=0.5",
    "faster-whisper>=1.0",
    "pyannote.audio>=3.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "jupyter>=1.0",
]

[project.scripts]
forensicaudio = "forensicaudio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forensicaudio"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
