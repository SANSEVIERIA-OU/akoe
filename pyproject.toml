[project]
name = "forensicaudio"
version = "0.0.1"
description = "Assisted transcription adapted to the subject and the vehicle, for covert recordings"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.5",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "librosa>=0.10",
    "noisereduce>=3.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Neural backends (CPU wheels work on EDGE; CUDA builds on WORKSTATION/CLOUD).
ml = [
    "torch>=2.5",
    "torchaudio>=2.5",
    "transformers>=4.45",
    "peft>=0.13",
    "accelerate>=1.0",
    "speechbrain>=1.0",
    "faster-whisper>=1.0",
    "sentencepiece>=0.2",
]
# NVIDIA NeMo for Parakeet-TDT / Canary (heavy; install separately).
ml-nemo = [
    "nemo-toolkit[asr]>=2.0",
]
# Evaluation and codec simulation helpers.
assess = [
    "jiwer>=3.0",
]
codecs = [
    "imageio-ffmpeg>=0.5",
]
# Engine API for the desktop app.
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "jupyter>=1.0",
]

[project.scripts]
forensicaudio = "forensicaudio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forensicaudio"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["slow: needs real models or downloads (deselected by default)"]
addopts = "-m 'not slow'"
