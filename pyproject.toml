[project]
name = "akoe"
version = "0.1.0"
description = "Assisted transcription adapted to the subject and the vehicle, for covert recordings"
requires-python = ">=3.11"
license = "LicenseRef-SANSEVIERIA-1.1"
license-files = ["LICENSE", "LICENSES/*", "NOTICE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.5",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "librosa>=0.10",
    "noisereduce>=3.0",
    "scikit-learn>=1.4",
    "threadpoolctl>=3.0",
]

[project.optional-dependencies]
# Neural backends (CPU wheels work on EDGE; CUDA builds on WORKSTATION/CLOUD).
ml = [
    "torch>=2.5",
    "torchaudio>=2.5",
    "transformers>=4.45",
    "peft>=0.13",
    "accelerate>=1.0",
    "speechbrain>=1.0",
    "faster-whisper>=1.0",
    "sentencepiece>=0.2",
]
# NVIDIA NeMo for Parakeet-TDT / Canary (heavy; install separately).
ml-nemo = [
    "nemo-toolkit[asr]>=2.0",
]
# Neural listening enhancers (UniPASE, MossFormer2, GTCRN, DeepFilterNet 3) and
# neural VADs (Silero, FireRedVAD); weights and model code are fetched at pinned
# revisions with SHA-256 checks (src/akoe/stages/neural_backends.py, vad_neural.py).
ml-listening = [
    "onnxruntime>=1.17",
    "omegaconf>=2.3",
    "einops>=0.8",
    "rotary-embedding-torch>=0.9",
    "torchinfo>=1.8",
    "silero-vad==6.2.3",
    "fireredvad==0.0.2",
]
# Evaluation and codec simulation helpers.
assess = [
    "jiwer>=3.0",
    "pystoi>=0.4",
]
codecs = [
    "imageio-ffmpeg>=0.5",
]
# Engine API for the desktop app.
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "jupyter>=1.0",
]

[project.scripts]
akoe = "akoe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akoe"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["slow: needs real models or downloads (deselected by default)"]
addopts = "-m 'not slow'"
